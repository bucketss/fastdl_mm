fastdl_enabled               "1"
fastdl_bind                  "0.0.0.0"
fastdl_port                  "0"
fastdl_root                  "cstrike"
fastdl_serve_dirs            "sprites,sound,sounds,overviews,models,maps,gfx"
fastdl_serve_types           "bsp,nav,res,wad,mdl,spr,wav,mp3,bmp,tga,txt,htm,html,bz2"
fastdl_max_file_mb           "250"
fastdl_threads               "1"
fastdl_max_connections_ip    "32"
fastdl_requests_minute       "500"
fastdl_denials_minute        "36"
fastdl_block_seconds         "180"
fastdl_log                   "logs/fastdl/fastdl.log"
fastdl_log_age               "7"

// remember to set sv_downloadurl to "http://your-ip:port/"

// CVARs:
// fastdl_enabled               toggle fastdl hosting (default "1")
// fastdl_bind                  listen address (default "0.0.0.0")
// fastdl_port                  listen port (TCP); 0 uses the game port number (default "0")
// fastdl_root                  game mod directory (default "cstrike")
// fastdl_serve_dirs            subdirectories served, comma separated (default "sprites,sound,sounds,overviews,models,maps,gfx")
// fastdl_serve_types           extensions served, comma separated (default "bsp,nav,res,wad,mdl,spr,wav,mp3,bmp,tga,txt,htm,html,bz2")
// fastdl_max_file_mb           refuse files larger than this (default "250")
// fastdl_threads               HTTP worker threads; raise only for slow disks (default "1")
// fastdl_max_connections_ip    concurrent connections per IP (default "32")
// fastdl_requests_minute       requests per minute per IP (default "500")
// fastdl_denials_minute        denials per minute before a temporary block (default "36")
// fastdl_block_seconds         how long a block lasts, in seconds (default "180")
// fastdl_log                   log base path; one file per day (default "logs/fastdl/fastdl.log")
// fastdl_log_age               days of logs to keep, 0 keeps all (default "7")
